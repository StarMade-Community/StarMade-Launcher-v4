name: Semgrep

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

jobs:
  scan:
    name: Semgrep OSS scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - run: pip install semgrep

      # p/default is the curated low-noise set. Add more packs to widen coverage,
      # e.g. --config p/security-audit --config p/react (noisier).
      # Semgrep honours .gitignore, so node_modules/ and dist/ are skipped.
      - run: semgrep scan --config p/default --sarif --output semgrep.sarif

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
